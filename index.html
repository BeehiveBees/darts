<style>
html{color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: logo masthead band, sticky tab bar, one column of content per tab (max ~960px). Dark-first: black and honey yellow from the club badge. */
:root{
  --bg:#0f0e0b; --surface:#1a1813; --surface-2:#242118; --line:#3a352a;
  --fg:#f6f1e3; --muted:#b5ab94; --honey:#f5b800; --honey-ink:#0f0e0b; --honey-soft:rgba(245,184,0,.14);
  --win:#5fc77a; --win-soft:rgba(95,199,122,.15); --loss:#ef6b5b; --loss-soft:rgba(239,107,91,.15);
  --f-display:"Alfa Slab One", "Rockwell", Georgia, serif;
  --f-body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#fbf6e6; --surface:#ffffff; --surface-2:#f4ecd2; --line:#e0d4b0;
  --fg:#17150f; --muted:#6b6250; --honey:#c48f00; --honey-ink:#17150f; --honey-soft:rgba(245,184,0,.22);
  --win:#1f8a3e; --win-soft:rgba(31,138,62,.12); --loss:#c0392b; --loss-soft:rgba(192,57,43,.1);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#fbf6e6; --surface:#ffffff; --surface-2:#f4ecd2; --line:#e0d4b0;
  --fg:#17150f; --muted:#6b6250; --honey:#c48f00; --honey-ink:#17150f; --honey-soft:rgba(245,184,0,.22);
  --win:#1f8a3e; --win-soft:rgba(31,138,62,.12); --loss:#c0392b; --loss-soft:rgba(192,57,43,.1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Masthead: always black + yellow, the club's colours, in both themes */
.mast{background:#0f0e0b;color:#f6f1e3;border-bottom:6px solid #f5b800;position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:repeating-linear-gradient(-45deg,#f5b800 0 14px,transparent 14px 28px)}
.mast .wrap{display:flex;gap:20px;align-items:center;padding-block:20px;position:relative;z-index:1}
.mast img{width:104px;height:104px;border-radius:50%;flex:none;box-shadow:0 0 0 3px #f5b800}
.mast h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:0;color:#f5b800;letter-spacing:.01em;text-wrap:balance}
.mast .sub{margin:6px 0 0;color:#d8cfb8;font-size:.95rem}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{font-family:var(--f-data);font-weight:600;font-size:.95rem;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:#f5b800;color:#0f0e0b;white-space:nowrap}
.pill.ghost{background:transparent;color:#f5b800;box-shadow:inset 0 0 0 1.5px #f5b800}

/* Tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font-family:var(--f-data);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;padding:14px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--honey)}
.tab:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--honey);outline-offset:2px}

main{padding-block:24px 48px}
section.panel{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--f-data);font-weight:700;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted)}
.lede{margin:-8px 0 0;color:var(--muted);max-width:65ch}
.note{font-size:.9rem;color:var(--muted);max-width:70ch;margin:0}
.note strong{color:var(--fg)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* Segmented control */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;align-self:flex-start}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:600 .95rem var(--f-body);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--honey);color:var(--honey-ink)}

/* Next-up card */
.next{background:var(--honey);color:#0f0e0b;border-radius:14px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline}
.next .k{font-family:var(--f-data);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem}
.next .v{font-family:var(--f-display);font-size:1.5rem;line-height:1.15}
.next .d{font-weight:600}

/* Fixture list */
.fx{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.fx li{display:grid;grid-template-columns:7.5rem 2.2rem 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.fx li.event{grid-template-columns:7.5rem 1fr;color:var(--muted)}
.fx li.event .ev{font-style:italic}
.fx li.past{opacity:.92}
.fx li.is-next{background:var(--honey-soft)}
.fx .date{font-family:var(--f-data);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.fx .opp{font-weight:600;min-width:0}
.ha{font-family:var(--f-data);font-weight:700;font-size:.85rem;width:2.2rem;text-align:center;padding:2px 0;border-radius:6px}
.ha.H{background:var(--honey);color:#0f0e0b}
.ha.A{box-shadow:inset 0 0 0 1.5px var(--honey);color:var(--honey)}
.res{font-family:var(--f-data);font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem;padding:2px 9px;border-radius:6px;white-space:nowrap}
.res.W{background:var(--win-soft);color:var(--win)}
.res.L{background:var(--loss-soft);color:var(--loss)}
.res.tbc{color:var(--muted)}
.month{font-family:var(--f-data);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;color:var(--honey);padding:18px 4px 6px;border-bottom:1px solid var(--line)}

/* Full league weeks */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.week .wd{font-family:var(--f-data);font-weight:700;color:var(--honey);letter-spacing:.04em;margin-bottom:6px}
.week ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.95rem}
.week li{display:flex;gap:6px}
.week li .vs{color:var(--muted);font-size:.85rem}
.week li.us{font-weight:700}
.week li.us::before{content:"";width:8px;height:8px;margin-top:.55em;flex:none;background:var(--honey);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.week .ev{color:var(--muted);font-style:italic}

/* Result cards */
.results{display:flex;flex-direction:column;gap:12px}
details.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.match summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 18px;align-items:center}
details.match summary::-webkit-details-marker{display:none}
.m-meta{font-family:var(--f-data);font-weight:600;color:var(--muted);letter-spacing:.02em;font-size:.95rem}
.m-title{font-weight:700;font-size:1.1rem}
.score{grid-row:span 2;font-family:var(--f-display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
.score .wl{font-family:var(--f-data);font-size:.95rem;padding:3px 9px;border-radius:6px}
.score .wl.W{background:var(--win-soft);color:var(--win)}
.score .wl.L{background:var(--loss-soft);color:var(--loss)}
.m-hint{grid-column:1/-1;font-size:.85rem;color:var(--honey);font-weight:600}
details[open] .m-hint .open{display:none}
details:not([open]) .m-hint .close{display:none}
.m-body{padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.legs{width:100%;border-collapse:collapse;font-size:.95rem}
.legs th{font-family:var(--f-data);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.legs td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.legs td.g{font-family:var(--f-data);color:var(--muted);width:2.5rem}
.legs td.r{width:3rem;text-align:right}
.dot{display:inline-block;font-family:var(--f-data);font-weight:700;font-size:.85rem;width:1.7rem;text-align:center;border-radius:5px;padding:1px 0}
.dot.W{background:var(--win-soft);color:var(--win)}
.dot.L{background:var(--loss-soft);color:var(--loss)}
.flag{background:var(--honey-soft);border-radius:10px;padding:10px 14px;font-size:.9rem}
.ko-out{display:inline-block;font-family:var(--f-data);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;color:var(--loss);box-shadow:inset 0 0 0 1.5px var(--loss);padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}

/* Data tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
table.data th,table.data td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.data th{font-family:var(--f-data);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--muted);background:var(--surface-2)}
table.data th.l,table.data td.l{text-align:left}
table.data td{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:1.02rem}
table.data td.name{font-family:var(--f-body);font-weight:600;font-size:.98rem}
table.data tr:last-child td{border-bottom:0}
table.data tr.us td{background:var(--honey-soft);font-weight:700}
table.data tr.total td{background:var(--surface-2);font-weight:700}
table.data th.grp{text-align:center;border-left:1px solid var(--line)}
table.data .bl{border-left:1px solid var(--line)}
table.data th button{all:unset;cursor:pointer}
table.data th button:focus-visible{outline:2px solid var(--honey)}
table.data th[aria-sort] button{color:var(--fg)}
.pct{font-weight:700}
.pos{font-family:var(--f-display);font-size:1.05rem;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.two > div{min-width:0;display:flex;flex-direction:column;gap:10px}

/* Stat summary */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .k{font-family:var(--f-data);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:1.8rem;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:.85rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--honey)}

/* Awards */
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.award{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.award .hex{width:38px;height:42px;background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:#0f0e0b;font-family:var(--f-display);font-size:1rem}
.award .t{font-family:var(--f-display);font-size:1.2rem;line-height:1.2}
.award .w{font-weight:700;font-size:1.05rem}
.award .w.tbc{color:var(--muted);font-weight:600;font-style:italic}
.award .c{font-size:.88rem;color:var(--muted)}

footer{border-top:1px solid var(--line);padding-block:18px;color:var(--muted);font-size:.85rem}

@media (max-width:560px){
  .mast img{width:76px;height:76px}
  .fx li{grid-template-columns:5.6rem 2.2rem 1fr auto;gap:8px}
  .fx li.event{grid-template-columns:5.6rem 1fr}
  .fx .date .dy{display:none}
  .score{font-size:1.5rem}
}
@media (prefers-reduced-motion: no-preference){
  section.panel{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>
</head>

  {season:"2026/27", items:[

/* ============================================================
   RENDERING
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmt = iso => { const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const fmtDay = iso => `<span class="dy">${DAYS[D(iso).getDay()]} </span>${fmt(iso)}`;
const today = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const pct = (w,p) => p ? Math.round(w/p*100) + "%" : "–";
const resultFor = d => MATCHES.find(m => m.d === d);

// Our fixtures derived from the full list
const OUR = WEEKS.map(w => {
  if (w.ev) return {d:w.d, ev:w.ev};
  const g = w.g.find(x => x.includes(US));
  return {d:w.d, ha: g[0]===US ? "H":"A", opp: g[0]===US ? g[1] : g[0]};
});
const nextFx = OUR.find(f => !f.ev && D(f.d) >= today && !resultFor(f.d));

function renderStrip(){
  const pos = TABLE.rows.findIndex(r => r[0]===US) + 1;
  const ord = n => n + (["th","st","nd","rd"][(n%100-20)%10] || ["th","st","nd","rd"][n%100] || "th");
  const lg = MATCHES.filter(m => m.comp==="League");
  const w = lg.filter(m => m.us>m.them).length;
  let h = `<span class="pill">${ord(pos)} in the league</span><span class="pill ghost">League record W${w} L${lg.length-w}</span>`;
  if (nextFx) h += `<span class="pill ghost">Next: ${fmt(nextFx.d)} v ${esc(nextFx.opp)} (${nextFx.ha})</span>`;
  $("#strip").innerHTML = h;
}

let fxMode = "ours";
function renderFixtures(){
  const p = $("#p-fixtures");
  let h = `<h2>Fixtures 2026/27</h2>`;
  if (nextFx) h += `<div class="next"><span class="k">Next match</span><span class="v">${nextFx.ha==="H" ? `Beehive Bees v ${esc(nextFx.opp)}` : `${esc(nextFx.opp)} v Beehive Bees`}</span><span class="d">${DAYS[D(nextFx.d).getDay()]} ${fmt(nextFx.d)} &middot; ${nextFx.ha==="H"?"Home":"Away"}</span></div>`;
  h += `<div class="seg" role="group" aria-label="Fixture view"><button id="fx-ours" aria-pressed="${fxMode==="ours"}">Our fixtures</button><button id="fx-all" aria-pressed="${fxMode==="all"}">Whole league</button></div>`;
  if (fxMode === "ours"){
    let month = "", rows = "";
    OUR.forEach(f => {
      const mo = D(f.d).getMonth(), lab = MONTHS[mo] + " " + D(f.d).getFullYear();
      if (lab !== month){ month = lab; rows += `<li class="month" style="display:block">${lab}</li>`; }
      const r = resultFor(f.d);
      if (f.ev && r){
        rows += `<li class="past"><span class="date">${fmtDay(f.d)}</span><span class="ha ${r.ha}">${r.ha}</span><span class="opp">${esc(r.opp)} <span class="m-meta">&middot; ${esc(r.comp)}</span></span><span class="res ${r.us>r.them?"W":"L"}">${r.us>r.them?"W":"L"} ${r.us}–${r.them}</span></li>`;
      } else if (f.ev){
        rows += `<li class="event"><span class="date">${fmtDay(f.d)}</span><span class="ev">${esc(f.ev)}</span></li>`;
      } else {
        const past = D(f.d) < today;
        const res = r ? `<span class="res ${r.us>r.them?"W":"L"}">${r.us>r.them?"W":"L"} ${r.us}–${r.them}</span>` : (past ? `<span class="res tbc">Result to follow</span>` : "");
        rows += `<li class="${past?"past":""} ${nextFx && f.d===nextFx.d ? "is-next":""}"><span class="date">${fmtDay(f.d)}</span><span class="ha ${f.ha}">${f.ha}</span><span class="opp">${esc(f.opp)}</span>${res||"<span></span>"}</li>`;
      }
    });
    h += `<ul class="fx">${rows}</ul>`;
  } else {
    h += `<div class="weeks">` + WEEKS.map(w => `<div class="week"><div class="wd">${DAYS[D(w.d).getDay()]} ${fmt(w.d)}</div>${
      w.ev ? `<div class="ev">${esc(w.ev)}</div>` :
      `<ul>${w.g.map(g => `<li class="${g.includes(US)?"us":""}"><span>${esc(g[0])} <span class="vs">v</span> ${esc(g[1])}</span></li>`).join("")}</ul>`}</div>`).join("") + `</div>`;
  }
  p.innerHTML = h;
  $("#fx-ours").onclick = () => { fxMode="ours"; renderFixtures(); };
  $("#fx-all").onclick = () => { fxMode="all"; renderFixtures(); };
}

function matchCard(m){
  const W = m.us > m.them;
  const title = m.ha==="H" ? `Beehive Bees v ${esc(m.opp)}` : `${esc(m.opp)} v Beehive Bees`;
  const fmts = ["Triples","Pairs","Singles"];
  const leg = {Triples:"801", Pairs:"601", Singles:"501"};
  let n = 0;
  const rows = fmts.map(f => m.games.filter(g => g[0]===f).map(g => { n++; return `<tr><td class="g">${n}</td><td>${f} <span class="m-meta">${leg[f]}</span></td><td>${g[1].map(esc).join(", ")}</td><td class="r"><span class="dot ${g[2]?"W":"L"}">${g[2]?"W":"L"}</span></td></tr>`; }).join("")).join("");
  const ours = [...m.s180.map(x => `180: ${esc(x)}`), ...m.co.map(x => `Checkout: ${esc(x[0])} ${x[1]}`)];
  return `<details class="match"><summary>
      <span class="m-meta">${DAYS[D(m.d).getDay()]} ${fmt(m.d)} &middot; ${m.comp}${m.round?" "+m.round:""} &middot; ${m.ha==="H"?"Home":"Away"}</span>
      <span class="score">${m.us}–${m.them}<span class="wl ${W?"W":"L"}">${W?"WON":"LOST"}</span></span>
      <span class="m-title">${title}${m.out?`<span class="ko-out">Knocked out</span>`:""}</span>
      <span class="m-hint"><span class="open">Show game-by-game</span><span class="close">Hide game-by-game</span></span>
    </summary>
    <div class="m-body">
      <div class="tablewrap" style="border:0;background:none"><table class="legs"><thead><tr><th>#</th><th>Game</th><th>Bees players</th><th style="text-align:right">Result</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note"><strong>Bees 180s and checkouts:</strong> ${ours.length ? ours.join("; ") : "none recorded."} ${esc(m.other||"")}</p>
      ${m.flag ? `<div class="flag">${esc(m.flag)}</div>` : ""}
    </div></details>`;
}
function renderResults(){
  const byDate = (a,b) => a.d.localeCompare(b.d);
  const lg = MATCHES.filter(m => m.comp==="League").sort(byDate);
  const ko = MATCHES.filter(m => m.comp!=="League").sort(byDate);
  $("#p-results").innerHTML = `<h2>Results</h2>
    <h3>League</h3><div class="results">${lg.map(matchCard).join("")}</div>
    <h3>Team Knockout</h3><div class="results">${ko.map(matchCard).join("")}</div>`;
}

function renderTable(){
  const t = TABLE;
  const rows = t.rows.map((r,i) => `<tr class="${r[0]===US?"us":""}"><td class="l"><span class="pos">${i+1}</span></td><td class="l name">${esc(r[0])}</td>${r.slice(1).map((v,j)=>`<td class="${j===7-1?"pct":""}">${v}</td>`).join("")}</tr>`).join("");
  const s180 = t.s180.map(r => `<tr class="${r[1]===US?"us":""}"><td class="l name">${esc(r[0])}</td><td class="l">${esc(r[1])}</td><td>${r[2]}</td></tr>`).join("");
  const co = t.co.map(r => `<tr class="${r[3]===US?"us":""}"><td>${r[0]}</td><td>${fmt(r[1])}</td><td class="l name">${esc(r[2])}</td><td class="l">${esc(r[3])}</td></tr>`).join("");
  $("#p-table").innerHTML = `<h2>League Table</h2>
    <div class="tablewrap"><table class="data"><thead><tr><th class="l">Pos</th><th class="l">Team</th><th>Played</th><th>Won</th><th>Lost</th><th>Singles</th><th>Pairs</th><th>Triples</th><th>Points</th></tr></thead><tbody>${rows}</tbody></table></div>    <div class="two">
      <div><h3>League 180s</h3><div class="tablewrap"><table class="data" style="min-width:0"><thead><tr><th class="l">Name</th><th class="l">Team</th><th>180s</th></tr></thead><tbody>${s180}</tbody></table></div></div>
      <div><h3>League high checkouts</h3><div class="tablewrap"><table class="data" style="min-width:0"><thead><tr><th>Score</th><th>Date</th><th class="l">Name</th><th class="l">Team</th></tr></thead><tbody>${co}</tbody></table></div></div>
    </div>`;
}

function computeStats(){
  const P = {};
  const get = n => P[n] ||= {name:n, Triples:[0,0], Pairs:[0,0], Singles:[0,0], s180:0, co:0};
  const team = {Triples:[0,0], Pairs:[0,0], Singles:[0,0]};
  MATCHES.filter(m => m.comp==="League").forEach(m => {
    m.games.forEach(([f, ps, won]) => {
      team[f][0]++; if (won) team[f][1]++;
      ps.forEach(n => { const s = get(n)[f]; s[0]++; if (won) s[1]++; });
    });
    m.s180.forEach(n => get(n).s180++);
    m.co.forEach(([n,v]) => { const p = get(n); p.co = Math.max(p.co, v); });
  });
  Object.values(P).forEach(p => { p.tp = p.Triples[0]+p.Pairs[0]+p.Singles[0]; p.tw = p.Triples[1]+p.Pairs[1]+p.Singles[1]; });
  return {players:Object.values(P), team};
}
function combos(f){
  const C = {};
  MATCHES.filter(m => m.comp==="League").forEach(m => m.games.filter(g => g[0]===f).forEach(([, ps, won]) => {
    const names = ps.slice().sort((a,b) => a.localeCompare(b)), k = names.join("|");
    const c = C[k] ||= {names, p:0, w:0}; c.p++; if (won) c.w++;
  }));
  return Object.values(C).sort((a,b) => b.p-a.p || b.w-a.w || a.names.join().localeCompare(b.names.join()));
}
let sortKey = "tw", sortDir = -1;
function renderStats(){
  const {players, team} = computeStats();
  const val = (p,k) => k==="name" ? p.name : k==="tp" ? p.tp : k==="tw" ? p.tw : k==="pct" ? (p.tp ? p.tw/p.tp : -1) :
    k==="s180" ? p.s180 : k==="co" ? p.co : k.endsWith("%") ? (p[k.slice(0,-1)][0] ? p[k.slice(0,-1)][1]/p[k.slice(0,-1)][0] : -1) : 0;
  players.sort((a,b) => { const x = val(a,sortKey), y = val(b,sortKey); if (x<y) return -sortDir; if (x>y) return sortDir; return b.tw-a.tw || a.name.localeCompare(b.name); });
  const lg = MATCHES.filter(m => m.comp==="League");
  const mw = lg.filter(m => m.us>m.them).length;
  const tile = (k, s) => `<div class="tile"><div class="k">${k}</div><div class="v">${pct(s[1],s[0])}</div><div class="s">Won ${s[1]} of ${s[0]}</div><div class="bar"><i style="width:${s[0]?s[1]/s[0]*100:0}%"></i></div></div>`;
  const tot = [0,1].map(i => team.Triples[i]+team.Pairs[i]+team.Singles[i]);
  const th = (k, lab, cls="") => `<th class="${cls}" ${sortKey===k?`aria-sort="${sortDir<0?"descending":"ascending"}"`:""}><button data-k="${k}">${lab}${sortKey===k?(sortDir<0?" ▾":" ▴"):""}</button></th>`;
  const cell = s => `<td class="bl">${s[0]}</td><td>${s[1]}</td><td class="pct">${pct(s[1],s[0])}</td>`;
  const rows = players.map(p => `<tr><td class="l name">${esc(p.name)}</td>${cell(p.Triples)}${cell(p.Pairs)}${cell(p.Singles)}${cell([p.tp,p.tw])}<td class="bl">${p.s180||"–"}</td><td>${p.co||"–"}</td></tr>`).join("");
  const trow = `<tr class="total"><td class="l name">Team</td>${cell(team.Triples)}${cell(team.Pairs)}${cell(team.Singles)}${cell(tot)}<td class="bl">${players.reduce((a,p)=>a+p.s180,0)||"–"}</td><td>${Math.max(0,...players.map(p=>p.co))||"–"}</td></tr>`;
  $("#p-stats").innerHTML = `<h2>Player Stats</h2><p class="lede">League, excluding Team Knockout and Knockouts</p>
    <div class="tiles"><div class="tile"><div class="k">All games</div><div class="v">${pct(tot[1],tot[0])}</div><div class="s">Won ${tot[1]} of ${tot[0]}</div><div class="bar"><i style="width:${tot[0]?tot[1]/tot[0]*100:0}%"></i></div></div>${tile("Triples · 801",team.Triples)}${tile("Pairs · 601",team.Pairs)}${tile("Singles · 501",team.Singles)}</div>
    <div class="tablewrap"><table class="data" style="min-width:820px"><thead>
      <tr><th class="l"></th><th class="grp" colspan="3">Triples</th><th class="grp" colspan="3">Pairs</th><th class="grp" colspan="3">Singles</th><th class="grp" colspan="3">Overall</th><th class="grp" colspan="2">Specials</th></tr>
      <tr>${th("name","Player","l")}<th class="bl">P</th><th>W</th>${th("Triples%","Win %")}<th class="bl">P</th><th>W</th>${th("Pairs%","Win %")}<th class="bl">P</th><th>W</th>${th("Singles%","Win %")}${th("tp","P","bl")}${th("tw","W")}${th("pct","Win %")}${th("s180","180s","bl")}${th("co","High C/O")}</tr>
    </thead><tbody>${rows}${trow}</tbody></table></div>
    <h2 style="margin-top:12px">Threes and Pairs Stats</h2>
    <div class="two">${["Triples","Pairs"].map(f => `<div><h3>${f==="Triples"?"Threes":"Pairs"}</h3><div class="tablewrap"><table class="data" style="min-width:0"><thead><tr><th class="l">Players</th><th>P</th><th>W</th><th>Win %</th></tr></thead><tbody>${
      combos(f).map(c => `<tr><td class="l name" style="white-space:normal">${c.names.map(esc).join(", ")}</td><td>${c.p}</td><td>${c.w}</td><td class="pct">${pct(c.w,c.p)}</td></tr>`).join("")
    }</tbody></table></div></div>`).join("")}</div>`;
  document.querySelectorAll("#p-stats th button").forEach(b => b.onclick = () => {
    const k = b.dataset.k; if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir = k==="name"?1:-1; } renderStats();
  });
}

function renderAwards(){
  const {players} = computeStats();
  const top180 = players.filter(p=>p.s180).sort((a,b)=>b.s180-a.s180)[0];
  const topCo = players.filter(p=>p.co).sort((a,b)=>b.co-a.co)[0];
  const live = k => k==="s180" ? (top180 ? `Current leader: ${esc(top180.name)} (${top180.s180})` : "Current leader: none recorded yet")
                 : k==="co" ? (topCo ? `Current leader: ${esc(topCo.name)} (${topCo.co})` : "Current leader: none recorded yet") : "";
  const icon = {"Captains' Player":"C","Players' Player":"P","Most 180s":"180","Highest Checkout":"C/O"};
  let h = `<h2>Awards</h2><p class="lede">Presented at the end of each season.</p>`;
  AWARDS.forEach((s,i) => {
    h += `<h3>Season ${s.season}</h3><div class="awards">${s.items.map(a => `<div class="award">
      <div class="hex" style="font-size:${icon[a.t].length>2?".7rem":"1rem"}">${icon[a.t]}</div>
      <div class="t">${esc(a.t)}</div>
      <div class="w ${a.w?"":"tbc"}">${a.w ? esc(a.w) : (i===0 ? "To be announced" : "To be confirmed")}</div>
      ${a.c ? `<div class="c">${esc(a.c)}</div>` : ""}${a.live && i===0 ? `<div class="c">${live(a.live)}</div>` : ""}
    </div>`).join("")}</div>`;
  });
  $("#p-awards").innerHTML = h;
}

/* Tabs with #hash deep links */
const TABS = ["fixtures","results","table","stats","awards"];
function show(t){
  if (!TABS.includes(t)) t = "fixtures";
  TABS.forEach(x => { $("#p-"+x).hidden = x!==t; $("#t-"+x).setAttribute("aria-selected", x===t); });
  try { if (location.hash !== "#"+t) history.replaceState(null, "", "#"+t); } catch(e){}
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { show(b.dataset.tab); window.scrollTo({top:0}); });
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

renderFixtures(); renderResults(); renderTable(); renderStats(); renderAwards();
$("#foot").textContent = `Last updated ${fmt(LAST_UPDATED)}`;
show(location.hash.slice(1));
</script>
